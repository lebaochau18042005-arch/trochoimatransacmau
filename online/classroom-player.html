<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma trận tô màu chữ cái – Cả lớp</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5ff;color:#1e293b;font-family:system-ui,Arial,sans-serif}header{text-align:center;background:white;padding:16px;border-bottom:3px solid #bfdbfe}h1{margin:0;color:#1d4ed8;font-size:clamp(25px,3vw,44px)}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px}.toolbar button,.next{padding:13px 22px;border:0;border-radius:13px;background:#1d4ed8;color:white;font-size:19px;cursor:pointer}.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;max-width:1500px;margin:auto;padding:16px}.panel{background:white;border-radius:20px;padding:clamp(16px,2vw,30px);box-shadow:0 8px 25px #93c5fd40;min-width:0}.art{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px;max-width:680px;margin:16px auto}.tile{aspect-ratio:1;background:#fff;border-radius:1px;border:1px solid #e2e8f0;display:grid;place-items:center;font-size:clamp(7px,.8vw,12px);font-weight:800;color:#334155;transition:background .2s}.tile.on{border-color:#ffffff77;color:#fff;text-shadow:0 1px 1px #0009}h2{font-size:clamp(24px,2.6vw,43px)}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:18px;border-radius:14px;border:2px solid #93c5fd;background:#eff6ff;font-size:clamp(20px,2vw,30px);cursor:pointer;color:#172554}.option:disabled{cursor:default}.option.correct{background:#bbf7d0;border-color:#16a34a}.option.wrong{background:#fecaca;border-color:#dc2626}.status{min-height:36px;font-size:clamp(19px,1.7vw,26px);font-weight:700}.muted{color:#475569}button:focus-visible{outline:4px solid #f59e0b;outline-offset:3px}@media(max-width:850px){.wrap{grid-template-columns:minmax(0,1fr)}}@media print{.toolbar{display:none}}
</style></head><body><header><h1>🌈 MA TRẬN TÔ MÀU THEO ĐÁP ÁN ĐÚNG</h1><div id="heading"></div></header><div class="toolbar"><button id="full">⛶ Toàn màn hình</button><button id="restart">↻ Chơi lại</button></div><main class="wrap"><section class="panel"><div id="counter"></div><h2 id="question"></h2><div id="options"></div><p class="status" id="status" aria-live="polite"></p><button class="next" id="next" hidden>Câu tiếp theo →</button></section><section class="panel"><h2>Hình bí mật</h2><p class="muted">Mỗi đáp án đúng sẽ tô các ô mang chữ cái tương ứng. Giáo viên điều khiển trên máy tính.</p><div class="art" id="art"></div><h2 id="score"></h2></section></main><script>
'use strict';
const $=id=>document.getElementById(id),EMPTY='#e2e8f0';
let raw;try{raw=JSON.parse(sessionStorage.getItem('mt_classroom_preview')||'null')}catch(e){}
sessionStorage.removeItem('mt_classroom_preview');
const safeColor=c=>/^#[0-9a-fA-F]{6}$/.test(c)?c:EMPTY;
const valid=raw&&Array.isArray(raw.questions)&&raw.questions.length>0&&raw.questions.length<=100&&Array.isArray(raw.pixels)&&raw.pixels.length===100&&raw.questions.every(q=>typeof q.text==='string'&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);
if(!valid){$('question').textContent='Chưa có dữ liệu trò chơi. Hãy mở chế độ Cả lớp từ giao diện tạo trò chơi của giáo viên.';$('next').hidden=true;document.querySelector('.toolbar').hidden=true;}
else{
const questions=raw.questions,pixels=raw.pixels.map(safeColor),SIZE=30;
const art=Array.from({length:SIZE*SIZE},(_,i)=>pixels[Math.floor(Math.floor(i/SIZE)/3)*10+Math.floor(i%SIZE/3)]);
const visible=art.map((c,i)=>c===EMPTY?-1:i).filter(i=>i>=0);
const pts=visible.map(i=>({i,x:i%SIZE,y:Math.floor(i/SIZE)}));
const seeds=[];if(pts.length)seeds.push(pts[0]);
while(seeds.length<questions.length&&seeds.length<pts.length){let best=null,max=-1;for(const p of pts){if(seeds.some(q=>q.i===p.i))continue;let d=Infinity;for(const q of seeds)d=Math.min(d,(p.x-q.x)**2+(p.y-q.y)**2);if(d>max){max=d;best=p}}if(!best)break;seeds.push(best)}
const regions=Array(SIZE*SIZE).fill(-1);
for(const p of pts){let best=0,dist=Infinity;seeds.forEach((q,j)=>{let d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<dist){dist=d;best=j}});regions[p.i]=best}
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const keys=questions.map((_,i)=>alphabet[i%26]);$('art').innerHTML=art.map((_,i)=>'<div class="tile">'+(regions[i]<0?alphabet[(i*17+11)%26]:keys[regions[i]])+'</div>').join('');
$('heading').textContent=(raw.title||'Trò chơi của lớp')+' · '+(raw.subject||'');
let current=0,correct=0,solved=new Set(),locked=false;
function paint(){Array.from($('art').children).forEach((el,i)=>{const on=regions[i]>=0&&solved.has(regions[i]);el.style.background=on?art[i]:'#ffffff';el.classList.toggle('on',on)})}
function render(){paint();$('score').textContent='Đã đúng: '+correct+'/'+questions.length;if(current>=questions.length){$('counter').textContent='Hoàn thành';$('question').textContent='🎉 Cả lớp đã hoàn thành!';$('options').innerHTML='';$('status').textContent='Chúc mừng! Hãy cùng khám phá hình bí mật.';$('next').hidden=true;return}locked=false;let q=questions[current];$('counter').textContent='Câu '+(current+1)+'/'+questions.length+' · Chữ tô màu: '+keys[current];$('question').textContent=q.text;$('status').textContent='Cả lớp thảo luận, giáo viên chọn đáp án.';$('options').innerHTML='';q.options.forEach((opt,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+opt+(j===q.answer?'':'');b.onclick=()=>answer(j);$('options').appendChild(b)});$('next').hidden=true}
function answer(j){if(locked)return;locked=true;const q=questions[current],ok=j===q.answer;Array.from($('options').children).forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});if(ok){correct++;solved.add(current);$('status').textContent='🌟 Chính xác! Đã tô các ô chữ “'+keys[current]+'”.'}else{$('status').textContent='Chưa đúng. Đáp án đúng là '+String.fromCharCode(65+q.answer)+'.'}paint();$('score').textContent='Đã đúng: '+correct+'/'+questions.length;$('next').hidden=false;$('next').textContent=current===questions.length-1?'Xem kết quả →':'Câu tiếp theo →'}
$('next').onclick=()=>{current++;render()};$('restart').onclick=()=>{if(confirm('Bắt đầu lại lượt chơi?')){current=0;correct=0;solved.clear();render()}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='Có thể nhấn F11 để trình chiếu toàn màn hình.'}};render();
}
</script></body></html>
