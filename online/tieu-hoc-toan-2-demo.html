<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé khám phá sắc màu · Pixel 3D · Toán lớp 2</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#23334d;background:#f1f7ff}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 24px;text-align:center;border-bottom:3px solid #bfdbfe}h1{margin:0;color:#2563eb;font-size:clamp(24px,4vw,36px)}p{line-height:1.5}.wrap{max-width:1080px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.panel{background:white;border-radius:22px;padding:22px;min-width:0;box-shadow:0 8px 28px #93c5fd30}.matrix{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:clamp(1px,.3vw,2px);width:100%;max-width:480px;min-width:0;margin:16px auto}.cell{aspect-ratio:1;border-radius:2px;background:#e2e8f0;border:1px solid #cbd5e1;position:relative;transition:transform .28s ease,box-shadow .28s ease,background .28s ease}.cell.revealed{border:1px solid #0002;transform:translateY(-1px);box-shadow:inset 1px 1px 2px #ffffff80,inset -2px -2px 2px #00000020,0 2px 0 #00000024,0 3px 4px #00000012;z-index:1}.matrix{perspective:800px;filter:drop-shadow(0 8px 12px #00000012)}.cell.revealed:hover{transform:translateY(-2px)}.panel h2{letter-spacing:.2px}html,body{max-width:100%;overflow-x:hidden}.answer{width:100%;padding:15px;border:2px solid #bfdbfe;border-radius:14px;background:#eff6ff;font-size:20px;font-weight:700;text-align:left;margin:7px 0;cursor:pointer}.answer:hover,.answer:focus{border-color:#2563eb;background:#dbeafe}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:52px;font-size:19px;font-weight:700}input{width:100%;padding:12px;border:2px solid #bfdbfe;border-radius:12px;font-size:18px}.primary{border:0;border-radius:14px;padding:14px 20px;background:#2563eb;color:white;font-size:18px;font-weight:700;cursor:pointer}.muted{color:#64748b}.score{font-size:24px;color:#0f766e;font-weight:800}@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}.wrap{padding:10px;max-width:100%}.panel{padding:16px}.matrix{max-width:min(100%,360px);gap:1px}.cell{border-radius:1px}.panel{min-width:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header><h1>🐱 Bé khám phá sắc màu</h1><p>Toán lớp 2 · Thử nghiệm Pixel 3D · Cộng, trừ trong phạm vi 100</p></header><main class="wrap"><div class="layout"><section class="panel"><h2>🎨 Hình bí mật</h2><p>Trả lời đúng để mở các khối màu nổi 3D và khám phá chú mèo nhé!</p><div class="matrix" id="matrix" aria-label="Hình bí mật 24 nhân 24"></div><p class="score" id="score">Đã đúng: 0/10</p><p class="muted">Bản thử nghiệm không lưu tên hoặc kết quả học sinh lên máy chủ.</p></section><section class="panel"><label for="name"><b>Tên của bé (không bắt buộc)</b></label><input id="name" maxlength="30" autocomplete="off" placeholder="Ví dụ: Minh Anh"><p id="step"></p><h2 id="question"></h2><div id="options"></div><p class="status" id="status" role="status" aria-live="polite"></p><button class="primary" id="next" hidden>Câu tiếp theo →</button><button class="primary" id="restart" hidden>Chơi lại ↻</button></section></div></main><script>
'use strict';
const quiz=[
 ['25 + 13 = ?',38,36,48,28],['47 - 15 = ?',32,22,42,30],['18 + 24 = ?',42,32,44,52],['63 - 21 = ?',42,41,32,44],['36 + 17 = ?',53,43,54,63],['90 - 35 = ?',55,65,45,54],['29 + 31 = ?',60,50,61,59],['75 - 28 = ?',47,57,53,48],['46 + 19 = ?',65,55,64,75],['82 - 37 = ?',45,55,44,46]
];const SIZE=24,EMPTY='#e2e8f0',FUR='#fb923c',INNER='#fda4af',DARK='#263244',CREAM='#fff7ed';const art=Array(SIZE*SIZE).fill(EMPTY);
function dot(x,y,c){if(x>=0&&x<SIZE&&y>=0&&y<SIZE)art[y*SIZE+x]=c}
function line(x0,y0,x1,y1,c){let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy;while(true){dot(x0,y0,c);if(x0===x1&&y0===y1)break;let e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
// Two triangular ears with pink interiors.
for(let y=3;y<=9;y++){const spread=Math.floor((y-3)*0.75);for(let x=5-spread;x<=5+spread;x++)dot(x,y,FUR);for(let x=18-spread;x<=18+spread;x++)dot(x,y,FUR)}
for(let y=5;y<=8;y++){const spread=Math.floor((y-5)*0.45);for(let x=5-spread;x<=5+spread;x++)dot(x,y,INNER);for(let x=18-spread;x<=18+spread;x++)dot(x,y,INNER)}
// Rounded head and soft cheeks.
for(let y=5;y<=22;y++)for(let x=1;x<=22;x++){const a=(x-11.5)/10.7,b=(y-13.2)/9.6;if(a*a+b*b<=1)dot(x,y,FUR)}
// Inner ear remains visible on top of the face.
for(let y=5;y<=8;y++){const spread=Math.floor((y-5)*0.45);for(let x=5-spread;x<=5+spread;x++)dot(x,y,INNER);for(let x=18-spread;x<=18+spread;x++)dot(x,y,INNER)}
// Cream muzzle, paired eyes, pink nose, curved smiling mouth.
for(let y=14;y<=19;y++)for(let x=5;x<=18;x++){const a=(x-11.5)/7.3,b=(y-16.6)/3.6;if(a*a+b*b<=1)dot(x,y,CREAM)}
for(let y=10;y<=12;y++)for(let x of [7,8,9,14,15,16])dot(x,y,DARK);dot(8,9,DARK);dot(15,9,DARK);
dot(8,10,CREAM);dot(15,10,CREAM);
for(let x=11;x<=12;x++)dot(x,15,INNER);dot(11,16,INNER);dot(12,16,INNER);
dot(11,17,DARK);dot(12,17,DARK);dot(10,18,DARK);dot(13,18,DARK);dot(9,18,DARK);dot(14,18,DARK);
// Three whiskers on each cheek.
dot(2,15,DARK);dot(3,15,DARK);dot(4,16,DARK);dot(2,18,DARK);dot(3,18,DARK);dot(4,18,DARK);dot(19,16,DARK);dot(20,15,DARK);dot(21,15,DARK);dot(19,18,DARK);dot(20,18,DARK);dot(21,18,DARK);let current=0,correct=0,solved=[],optionOrders=[];function shuffleOptions(){optionOrders=quiz.map(()=>{const a=[1,2,3,4];for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a})}shuffleOptions();const $=id=>document.getElementById(id);
// Partition only visible pixels into ten spatial clusters, not horizontal stripes.
// Deterministic farthest-point seeds followed by nearest-centroid assignment.
const visiblePixels=art.map((c,i)=>c===EMPTY?-1:i).filter(i=>i>=0);
const positions=visiblePixels.map(i=>({i,x:i%SIZE,y:Math.floor(i/SIZE)}));
const seeds=[];if(positions.length)seeds.push(positions.reduce((best,p)=>p.y<best.y||(p.y===best.y&&p.x<best.x)?p:best,positions[0]));
while(seeds.length<quiz.length&&seeds.length<positions.length){let winner=null,best=-1;for(const p of positions){if(seeds.some(q=>q.i===p.i))continue;const distance=Math.min(...seeds.map(q=>(p.x-q.x)**2+(p.y-q.y)**2));if(distance>best){best=distance;winner=p}}if(!winner)break;seeds.push(winner)}
const regions=Array(SIZE*SIZE).fill(-1);for(const p of positions){let nearest=0,dist=Infinity;seeds.forEach((q,j)=>{const d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<dist){dist=d;nearest=j}});regions[p.i]=nearest}
function paint(){const cells=$('matrix').children;for(let i=0;i<SIZE*SIZE;i++){const show=regions[i]>=0&&solved.includes(regions[i]);cells[i].style.background=show?art[i]:EMPTY;cells[i].classList.toggle('revealed',show)}}
for(let i=0;i<SIZE*SIZE;i++){const d=document.createElement('div');d.className='cell';$('matrix').appendChild(d)}paint();
function render(){if(current>=quiz.length){$('question').textContent='🎉 Hoàn thành! Chúc mừng bé!';$('step').textContent='Bạn đã trả lời hết 10 câu.';$('options').replaceChildren();$('status').textContent=(correct===10?'🏆 Xuất sắc! Bé đã khám phá trọn vẹn chú mèo! ':'🌈 Giỏi lắm! Hãy thử lại để khám phá thêm màu sắc nhé! ')+'Kết quả: '+correct+'/10 câu đúng.';$('restart').hidden=false;$('next').hidden=true;return}const q=quiz[current];$('step').textContent='Câu '+(current+1)+' / '+quiz.length;$('question').textContent=q[0];$('status').textContent='';$('next').hidden=true;$('options').replaceChildren();for(let j=0;j<4;j++){const option=optionOrders[current][j];const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+q[option];b.onclick=()=>choose(option);$('options').appendChild(b)}}
function choose(j){const q=quiz[current],ok=q[j]===q[1];for(const b of $('options').children)b.disabled=true;if(ok){correct++;solved.push(current);paint();$('status').textContent='🌟 Chính xác! Bé mở được thêm một phần hình!'}else{$('status').textContent='💛 Chưa đúng. Đáp án đúng là '+q[1]+'. Cùng cố gắng ở câu tiếp theo nhé!'}$('score').textContent='Đã đúng: '+correct+'/10';$('next').textContent=current===quiz.length-1?'Xem kết quả 🎉':'Câu tiếp theo →';$('next').hidden=false;$('next').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('next').onclick=()=>{current++;render()};$('restart').onclick=()=>{current=0;correct=0;solved=[];shuffleOptions();$('score').textContent='Đã đúng: 0/10';paint();$('restart').hidden=true;render()};render();
</script></body></html>
