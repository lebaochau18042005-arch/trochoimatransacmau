<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé khám phá sắc màu · Toán lớp 2</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#23334d;background:#f1f7ff}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 24px;text-align:center;border-bottom:3px solid #bfdbfe}h1{margin:0;color:#2563eb;font-size:clamp(24px,4vw,36px)}p{line-height:1.5}.wrap{max-width:1080px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 28px #93c5fd30}.matrix{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;max-width:420px;margin:16px auto}.cell{aspect-ratio:1;border-radius:4px;background:#e2e8f0;border:1px solid #cbd5e1}.answer{width:100%;padding:15px;border:2px solid #bfdbfe;border-radius:14px;background:#eff6ff;font-size:20px;font-weight:700;text-align:left;margin:7px 0;cursor:pointer}.answer:hover,.answer:focus{border-color:#2563eb;background:#dbeafe}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:52px;font-size:19px;font-weight:700}input{width:100%;padding:12px;border:2px solid #bfdbfe;border-radius:12px;font-size:18px}.primary{border:0;border-radius:14px;padding:14px 20px;background:#2563eb;color:white;font-size:18px;font-weight:700;cursor:pointer}.muted{color:#64748b}.score{font-size:24px;color:#0f766e;font-weight:800}@media(max-width:700px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:16px}.matrix{max-width:330px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><h1>🐱 Bé khám phá sắc màu</h1><p>Toán lớp 2 · Phép cộng, phép trừ trong phạm vi 100</p></header><main class="wrap"><div class="layout"><section class="panel"><h2>🎨 Hình bí mật</h2><p>Trả lời đúng để mở từng phần hình chú mèo nhé!</p><div class="matrix" id="matrix" aria-label="Hình bí mật 16 nhân 16"></div><p class="score" id="score">Đã đúng: 0/10</p><p class="muted">Bản thử nghiệm không lưu tên hoặc kết quả học sinh lên máy chủ.</p></section><section class="panel"><label for="name"><b>Tên của bé (không bắt buộc)</b></label><input id="name" maxlength="30" autocomplete="off" placeholder="Ví dụ: Minh Anh"><p id="step"></p><h2 id="question"></h2><div id="options"></div><p class="status" id="status" role="status" aria-live="polite"></p><button class="primary" id="next" hidden>Câu tiếp theo →</button><button class="primary" id="restart" hidden>Chơi lại ↻</button></section></div></main><script>
'use strict';
const quiz=[
 ['25 + 13 = ?',38,36,48,28],['47 - 15 = ?',32,22,42,30],['18 + 24 = ?',42,32,44,52],['63 - 21 = ?',42,41,32,44],['36 + 17 = ?',53,43,54,63],['90 - 35 = ?',55,65,45,54],['29 + 31 = ?',60,50,61,59],['75 - 28 = ?',47,57,53,48],['46 + 19 = ?',65,55,64,75],['82 - 37 = ?',45,55,44,46]
];const rows=["..OO........OO..",".OOOO......OOOO.","OOOOOO....OOOOOO","OOOOOOOOOOOOOOOO","OOOOOOOOOOOOOOOO","OOOWWOOOOOOWWOOO","OOOWWOOOOOOWWOOO","OOOOOOOOOOOOOOOO","OOOOOOOPPOOOOOOO","OOOOOOOPPOOOOOOO","OOOOOOWWWWOOOOOO","OOOOOOOWOOOOOOOO","OOOOOOOOOOOOOOOO",".OOOOOOOOOOOOOO.","..OOOOOOOOOOOO..","....OOOOOOOO...."];const art=rows.join('').split('').map(x=>x==='O'?'#fb923c':x==='W'?'#1f2937':x==='P'?'#fda4af':'#e2e8f0');let current=0,correct=0,solved=[],optionOrders=[];function shuffleOptions(){optionOrders=quiz.map(()=>{const a=[1,2,3,4];for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a})}shuffleOptions();const $=id=>document.getElementById(id);
function paint(){const cells=$('matrix').children;for(let i=0;i<256;i++)cells[i].style.background=solved.some(k=>Math.floor(i/256*10)===k)?art[i]:'#e2e8f0'}
for(let i=0;i<256;i++){const d=document.createElement('div');d.className='cell';$('matrix').appendChild(d)}paint();
function render(){if(current>=quiz.length){$('question').textContent='🎉 Hoàn thành!';$('step').textContent='Bạn đã trả lời hết 10 câu.';$('options').replaceChildren();$('status').textContent='Tuyệt vời! Bé trả lời đúng '+correct+'/10 câu.';$('restart').hidden=false;$('next').hidden=true;return}const q=quiz[current];$('step').textContent='Câu '+(current+1)+' / '+quiz.length;$('question').textContent=q[0];$('status').textContent='';$('next').hidden=true;$('options').replaceChildren();for(let j=0;j<4;j++){const option=optionOrders[current][j];const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+q[option];b.onclick=()=>choose(option);$('options').appendChild(b)}}
function choose(j){const q=quiz[current],ok=q[j]===q[1];for(const b of $('options').children)b.disabled=true;if(ok){correct++;solved.push(current);paint();$('status').textContent='🌟 Chính xác! Bé mở được thêm một phần hình!'}else{$('status').textContent='💛 Chưa đúng. Đáp án đúng là '+q[1]+'. Cùng cố gắng ở câu tiếp theo nhé!'}$('score').textContent='Đã đúng: '+correct+'/10';$('next').hidden=false}
$('next').onclick=()=>{current++;render()};$('restart').onclick=()=>{current=0;correct=0;solved=[];shuffleOptions();$('score').textContent='Đã đúng: 0/10';paint();$('restart').hidden=true;render()};render();
</script></body></html>
